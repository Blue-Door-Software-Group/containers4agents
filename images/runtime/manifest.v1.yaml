  user: c4a
  uid: 10001
packages:
  apt:
    - bash
    - ca-certificates
    - coreutils
    - file
    - findutils
    - gawk
    - grep
    - jq
    - libmagic1
    - libreoffice-calc
    - libreoffice-impress
    - libreoffice-writer
    - pandoc
    - p7zip-full
    - poppler-utils
    - procps
