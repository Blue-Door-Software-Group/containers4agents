version: v1
base_image: python:3.12-slim-bookworm
workspace:
  root: /workspace
  user: c4a
  uid: 10001
packages:
  apt:
    - bash
    - ca-certificates
    - coreutils
    - file
    - findutils
    - gawk
    - graphviz
    - grep
    - jq
    - libmagic1
    - libreoffice-calc
    - libreoffice-impress
    - libreoffice-writer
    - pandoc
    - p7zip-full
    - poppler-utils
    - procps
    - qpdf
    - sed
    - tar
    - unzip
    - xz-utils
    - zip
    - fonts-dejavu
    - fonts-liberation
    - fonts-noto-core
    - fonts-noto-cjk
    - fonts-noto-color-emoji
    - libasound2
    - libatk-bridge2.0-0
    - libatk1.0-0
    - libatomic1
    - libatspi2.0-0
    - libcairo2
    - libcups2
    - libdrm2
    - libgbm1
    - libnspr4
    - libnss3
    - libpango-1.0-0
    - libxcomposite1
    - libxdamage1
    - libxfixes3
    - libxi6
    - libxkbcommon0
    - libxrandr2
  pip:
    - numpy
    - pandas
    - pyarrow
    - tabulate
    - openpyxl
    - XlsxWriter
    - python-docx
    - python-pptx
    - msoffcrypto-tool
    - pypdf[crypto]
    - pdfplumber
    - pypdfium2
    - reportlab
    - Pillow
    - matplotlib
    - CairoSVG
    - lxml
    - beautifulsoup4
    - defusedxml
    - markdown
    - Jinja2
    - PyYAML
    - ruamel.yaml
    - tomlkit
    - odfpy
    - nbformat
    - EbookLib
    - striprtf
    - icalendar
    - vobject
    - extract-msg
    - xlrd
    - pyxlsb
    - pyreadstat
    - python-magic
    - charset-normalizer
    - py7zr
    - zstandard
    - playwright==1.65.1
tools:
  drawio-tool:
    path: /usr/local/bin/drawio-tool
    source: images/runtime/drawio-tool/
    docs: docs/DIAGRAM_TOOLS.md
  chromium-headless-shell:
    path: /opt/ms-playwright
    source: playwright install --only-shell chromium
  drawio-webapp:
    path: /opt/drawio
    source: draw.war v32.6.10 (SHA-256 checked)
excluded_features:
  - ocr
shell:
  command: ["bash", "-lc", "sleep infinity"]
