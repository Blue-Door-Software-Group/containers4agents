name: Diagrams image validation

# Builds the optional runtime-diagrams image (Chromium + draw.io) and smoke
# tests drawio-tool render/from-mermaid/from-vsdx in it. Only runs when the
# runtime images change, since the build downloads ~400 MB.
on:
  pull_request:
    paths:
      - "images/runtime/**"
      - "images/runtime-diagrams/**"
      - ".github/workflows/diagrams-image-validation.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diagrams-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Plain `docker build` (the daemon's own builder) so the second build can
      # start FROM the image the first one produced.
      - name: Build runtime image
        run: docker build -f images/runtime/Dockerfile -t c4a-runtime:ci .

      - name: Build runtime-diagrams image
        run: >-
          docker build -f images/runtime-diagrams/Dockerfile
          --build-arg RUNTIME_IMAGE=c4a-runtime:ci -t c4a-runtime-diagrams:ci .

      - name: Smoke test drawio-tool in runtime-diagrams image
        run: images/runtime/drawio-tool/tests/docker-smoke.sh c4a-runtime-diagrams:ci --diagrams
