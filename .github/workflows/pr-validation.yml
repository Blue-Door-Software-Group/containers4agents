name: PR Validation

on:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  go-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify module tidiness
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Verify formatting
        run: |
          test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build control-plane binary
        run: go build ./cmd/containers4agents

  docker-image-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build control-plane image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./images/runtime/Dockerfile
          push: false
          load: true
          tags: c4a-runtime:ci
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test drawio-tool in runtime image
        run: images/runtime/drawio-tool/tests/docker-smoke.sh c4a-runtime:ci

      # Uploads run as the image's user and commands as uid 65534: a folder an upload made must
      # take new files from commands (internal/provider/docker's upload script, umask 000).
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Uploaded folders are writable by the exec user
        env:
          C4A_DOCKER_TEST_IMAGE: c4a-runtime:ci
        run: go test ./internal/provider/docker/ -run TestUploadedFoldersAreWritableByTheExecUser -count=1 -v
